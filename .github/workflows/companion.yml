name: Sayuri Companion

on:
  push:
    branches:
      - main
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_VERSION: "9.6.1"
      GRADLE_SHA256: "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"
      COMPANION_VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install verified Gradle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sayuri-gradle"
          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$RUNNER_TEMP/sayuri-gradle/gradle.zip"
          echo "${GRADLE_SHA256}  $RUNNER_TEMP/sayuri-gradle/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/sayuri-gradle/gradle.zip" -d "$RUNNER_TEMP/sayuri-gradle"
          echo "$RUNNER_TEMP/sayuri-gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build Companion APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace --non-interactive \
            -p companion :app:assembleDebug

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/companion-release"
          cp companion/app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/companion-release/Sayuri-Companion-v${COMPANION_VERSION}.apk"
          cd "$RUNNER_TEMP/companion-release"
          sha256sum "Sayuri-Companion-v${COMPANION_VERSION}.apk" \
            > "Sayuri-Companion-v${COMPANION_VERSION}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sayuri-Companion-v${{ env.COMPANION_VERSION }}
          path: |
            ${{ runner.temp }}/companion-release/Sayuri-Companion-v${{ env.COMPANION_VERSION }}.apk
            ${{ runner.temp }}/companion-release/Sayuri-Companion-v${{ env.COMPANION_VERSION }}.apk.sha256
          if-no-files-found: error

      - name: Publish versioned Companion release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="companion-v${COMPANION_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Sayuri Companion ${COMPANION_VERSION}" \
              --notes "Android companion for local Sayuri Tsukishiro phone integration."
          fi
          gh release upload "$TAG" \
            "$RUNNER_TEMP/companion-release/Sayuri-Companion-v${COMPANION_VERSION}.apk" \
            "$RUNNER_TEMP/companion-release/Sayuri-Companion-v${COMPANION_VERSION}.apk.sha256" \
            --clobber
